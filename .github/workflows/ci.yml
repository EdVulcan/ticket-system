name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install PostgreSQL test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: "0"
          PGPASSWORD: postgres
      - name: Race test
        run: go test -race ./... -count=1 -timeout 10m
        env:
          CGO_ENABLED: "1"
          PGPASSWORD: postgres
      - name: PostgreSQL integration
        shell: bash
        run: |
          createdb -h 127.0.0.1 -U postgres ticket_system_test
          createdb -h 127.0.0.1 -U postgres ticket_system_restore_test
          TICKET_TEST_POSTGRES=1 go test ./internal/backup -run TestPostgresBackupAndRestore -count=1
        env:
          CGO_ENABLED: "0"
          PGPASSWORD: postgres
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Build Linux server artifact
        run: go build -trimpath -ldflags="-s -w" -o ticket-backend ./cmd
        env:
          CGO_ENABLED: "0"
      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-backend
          path: backend/ticket-backend
          retention-days: 3
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, desktop]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload admin artifact
        if: matrix.app == 'admin'
        uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: admin/dist
          retention-days: 3
          if-no-files-found: error

  admin-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install PostgreSQL test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PGPASSWORD: postgres
      - run: npm ci
        working-directory: desktop
      - run: npm run test:e2e
        working-directory: desktop

  desktop-wails:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build Windows POS
        run: wails build -clean -webview2 embed

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, admin-e2e, desktop-wails]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux server artifact
        uses: actions/download-artifact@v4
        with:
          name: server-backend
          path: release/backend
      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-web
          path: release/admin/dist
      - name: Assemble release
        shell: bash
        run: |
          install -d release/backend/config
          install -m 0644 backend/config/config.yaml release/backend/config/config.yaml
          chmod 0755 release/backend/ticket-backend
          tar -czf "ticket-system-${GITHUB_SHA}.tar.gz" -C release .
      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/ticket-system-deploy
          chmod 0600 ~/.ssh/ticket-system-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload and activate release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          port="${DEPLOY_PORT:-22}"
          archive="ticket-system-${GITHUB_SHA}.tar.gz"
          scp -P "$port" -i ~/.ssh/ticket-system-deploy "$archive" "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          ssh -p "$port" -i ~/.ssh/ticket-system-deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; install -d -m 2775 '/opt/ticket-system/releases/${GITHUB_SHA}'; tar -xzf '$archive' -C '/opt/ticket-system/releases/${GITHUB_SHA}'; rm -f '$archive'; sudo /usr/local/sbin/ticket-system-deploy '${GITHUB_SHA}'"
