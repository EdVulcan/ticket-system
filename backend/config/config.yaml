server:
  port: 8080
  mode: debug
  cors_allowed_origins: "http://127.0.0.1:5173,http://localhost:5173"
  admin_static_dir: "../admin/dist"

database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  name: "ticket_system"
  user: "ticket_app"
  # Set TICKET_DATABASE_PASSWORD or TICKET_DATABASE_URL outside this file.
  sslmode: "disable"
  time_zone: "Asia/Shanghai"
  max_open_connections: 50
  max_idle_connections: 10
  conn_max_lifetime_minutes: 30
  write_timeout_seconds: 10

security:
  # Environment variables override these values. If blank, a persistent key file is generated.
  jwt_secret: ""
  encryption_key: ""
  key_file: "data/instance-key.json"
  ota_max_clock_skew_seconds: 300

bootstrap:
  tenant_name: "Default Tenant"
  system_code: "SYS001"
  admin_username: "admin"
  # Only used when the database has no users. Set through the environment.
  admin_password: ""
  platform_username: "platform_admin"
  # Independent from the tenant administrator; set through the environment.
  platform_password: ""

backup:
  directory: "data/backups"
  interval_hours: 24
  retention: 14
  # Leave empty when pg_dump/pg_restore are on PATH, or set
  # TICKET_BACKUP_POSTGRES_BIN_DIR on the deployment machine.
  postgres_bin_dir: ""

log:
  level: debug
  filename: "app.log"
  max_size: 10
  max_age: 30
  max_backups: 5
