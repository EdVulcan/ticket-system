function updateCart(){const total=cart.delivery+cart.shipping,count=Number(cart.delivery>0)+Number(cart.shipping>0);el("cartbar").classList.toggle("show",total>0);el("cartbar").querySelector("b").textContent=yuan(total);el("cartbar").querySelector("small").textContent=count>1?"将拆为 2 张订单":cart.shipping?"冷吃商品走快递":"现做餐品走校园跑腿"}
function openCart(){let html="";if(cart.delivery)html+='<div class="split"><h3>校园外卖单</h3><p>成都校园地址 · 跑腿费另计</p><div class="row"><span>商品小计</span><b>'+yuan(cart.delivery)+'</b></div></div>';if(cart.shipping)html+='<div class="split"><h3>冷吃快递单</h3><p>成都门店发货 · 快递费另计</p><div class="row"><span>商品小计</span><b>'+yuan(cart.shipping)+'</b></div></div>';el("splits").innerHTML=html;const both=cart.delivery&&cart.shipping;el("addressTitle").textContent=both?"需要确认两种收货地址":cart.delivery?"校园收货地址":"快递收货地址";el("addressText").textContent=both?"成都某高校东校区 6 号楼 / 重庆市渝中区解放碑街道":cart.delivery?"成都某高校东校区学生公寓 6 号楼":"重庆市渝中区解放碑街道";el("cart").classList.add("show")}
function toast(text){el("toast").textContent=text;el("toast").style.display="block";clearTimeout(el("toast").timer);el("toast").timer=setTimeout(()=>el("toast").style.display="none",1000)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>t.dataset.mode?openMode(t.dataset.mode):show(t.dataset.page));document.querySelectorAll(".sheet").forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove("show")});document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest(".sheet").classList.remove("show"));document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{document.querySelectorAll(".option").forEach(x=>x.classList.remove("active"));b.classList.add("active")});el("minus").onclick=()=>{quantity=Math.max(1,quantity-1);el("qty").textContent=quantity};el("plus").onclick=()=>{quantity++;el("qty").textContent=quantity};el("detailAdd").onclick=()=>{add(selected,quantity);el("detail").classList.remove("show")};el("cartbar").onclick=openCart;el("pay").onclick=()=>{document.querySelector("#cart .panel").innerHTML='<div class="success"><i>✓</i><h2>两张订单已分别创建</h2><p>校园外卖单等待门店叫跑腿<br>冷吃快递单等待成都门店发货</p><button id="viewOrders" class="pay">查看订单</button></div>';el("viewOrders").onclick=()=>{el("cart").classList.remove("show");show("orders")}};
renderShop();syncTabs();
</script></body></html>
