<body>
<div class="mobile-tools"><span>设计原型 · 不产生真实订单</span><select aria-label="预览页面" id="mobile-screen"></select></div>
<div class="studio"><aside class="sidebar"><span class="studio-label">小红书小程序 / 设计预览</span><h1>把购票变简单</h1><p>先确认页面的样子与操作节奏。<br>以下为示例数据，不调用支付。</p><nav id="pages"></nav><div class="variant-summary" id="description"></div><div class="mock-status"><label for="demo-state">支付结果预览</label><select id="demo-state"><option value="unpaid">待支付</option><option value="failed">拉起失败（示例）</option><option value="paid">已支付（示例）</option></select></div><p class="side-note">商户名称、票种、价格和使用规则，正式版均来自后台。<br><br>当前没有合适的景区实拍图，原型先用文字与信息排版，不用虚构景色代替。</p></aside>
<main class="stage"><section class="device" aria-label="小程序预览"><div class="system"><span>14:12</span><div class="signals"><svg viewBox="0 0 18 14"><path d="M2 11V8M6 11V6M10 11V3M14 11V1"/></svg><svg viewBox="0 0 20 12"><rect x="1" y="2" width="15" height="8" rx="2"/><path d="M18 4v4M4 4h9v4H4z"/></svg></div></div><header class="native-nav"><button id="back" aria-label="返回"></button><span class="native-title">云门山景区</span><span class="capsule" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="4" cy="10" r=".8"/><circle cx="10" cy="10" r=".8"/><circle cx="16" cy="10" r=".8"/></svg><i></i><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="2"/></svg></span></header><div class="viewport" id="view"></div><div id="footer"></div></section></main></div>
<div class="prototype-controls" aria-label="切换设计方案"><button id="prev-variant" aria-label="上一方案"></button><span class="variant-name" id="variant-label"></span><button id="next-variant" aria-label="下一方案"></button></div>
<script>
const icons={back:'<path d="m13 5-7 7 7 7"/>',next:'<path d="m9 5 7 7-7 7"/>',ticket:'<path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4z"/><path d="M8 5v3m0 3v2m0 3v3"/>',order:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const screens=[['home','购票首页'],['product','商品详情'],['confirm','确认订单'],['orders','我的订单'],['result','订单详情']];
let params=new URLSearchParams(location.search),variant=params.get('variant')==='B'?'B':'A',screen=screens.some(([key])=>key===params.get('screen'))?params.get('screen'):'result';
let quantity=1,date='',status='unpaid',paymentError=false,filter='all';
const price=()=> (80*quantity).toFixed(2);
const money=value=>`<small>¥</small>${value}`;
const productLine=()=>`<div class="product-line"><div class="ticket-mark">${icon('ticket')}</div><div><h3 class="product-name">云门山景区成人门票</h3><div class="product-desc">景区门票 · ${quantity} 张</div></div></div>`;
const nav=current=>`<nav class="tabs-nav"><button class="nav-item ${current==='home'?'active':''}" data-go="home">${icon('ticket')}购票</button><button class="nav-item ${current==='orders'?'active':''}" data-go="orders">${icon('order')}订单</button></nav>`;
const orderItem=()=>`<article class="order-item"><div class="row"><span>2026.09.07 14:12</span><span class="status-text ${status}">${status==='paid'?'已支付':'待支付'}</span></div>${productLine()}<div class="row amount-line"><span>${status==='paid'?'实付':'待支付'}<strong>¥${price()}</strong></span><button class="outline-button" data-go="result">${status==='paid'?'查看票码':'去支付'}</button></div></article>`;
function render(){
 document.querySelector('.device').classList.toggle('design-b',variant==='B');
 document.querySelector('#variant-label').textContent=variant==='A'?'A · 清爽列表':'B · 纸质票夹';
 document.querySelector('#description').textContent=variant==='A'?'A / 白底、自然绿、开放排版。价格与操作清楚，信息用留白和细线分组。':'B / 暖灰底、纸票结构、衬线标题。商品和订单集中在票面，突出凭证感。';
 document.querySelector('#pages').innerHTML=screens.map(([key,label],i)=>`<button class="screen-link ${screen===key?'active':''}" data-go="${key}"><span>0${i+1}</span>${label}</button>`).join('');
 document.querySelector('#mobile-screen').innerHTML=screens.map(([key,label])=>`<option value="${key}" ${screen===key?'selected':''}>${label}</option>`).join('');
 document.querySelector('#demo-state').value=status==='paid'?'paid':paymentError?'failed':'unpaid';
 let html='',footer='';
 if(screen==='home'){
 html=`<h2 class="title">门票与套餐</h2><p class="subtitle">选择商品，查看使用规则</p><label class="search">${icon('search')}<input id="search" placeholder="搜索门票或套餐" aria-label="搜索商品"></label><div class="filter-line"><span>全部商品 <span class="muted">1</span></span><select aria-label="排序"><option>综合排序</option><option>价格从低到高</option><option>价格从高到低</option></select></div><div id="product-list"><article class="sale-row">${productLine()}<div class="row"><span class="price">${money('80.00')}</span><button class="outline-button" data-go="product">查看详情</button></div></article></div><div id="no-results" class="empty" hidden>没有找到相关商品</div>`;footer=nav('home');
 }else if(screen==='product'){
 html=`<div class="detail-heading"><span class="small">景区门票</span><h2 class="title">云门山景区<br>成人门票</h2><span class="price">${money('80.00')}</span></div><div class="rule-table"><h3 class="section-title">使用说明</h3><div class="info-row"><span>游玩日期</span><span>下单时选择</span></div><div class="info-row"><span>入园方式</span><span>支付成功后查看电子票码</span></div><div class="info-row"><span>退改说明</span><span>以票种实际规则<br>和订单状态为准</span></div></div><div class="divider"></div><p class="rule">购买前请核对日期与数量。已购门票可在“我的订单”中查看。</p>`;footer=`<div class="footer"><div class="footer-line"><div><span class="price-label">售价</span><span class="price">${money('80.00')}</span></div><button class="primary" data-go="confirm">立即选购</button></div></div>`;
 }else if(screen==='confirm'){
 html=`<h2 class="title">确认订单</h2><div class="summary-product">${productLine()}</div><div class="form-row"><span>游玩日期</span><input type="date" id="use-date" aria-label="游玩日期" value="${date}" min="2026-09-07"></div><div class="form-row"><span>购买数量</span><div class="stepper"><button id="minus" aria-label="减少数量" ${quantity===1?'disabled':''}>−</button><span>${quantity}</span><button id="plus" aria-label="增加数量" ${quantity===10?'disabled':''}>+</button></div></div><div class="row total-row"><span class="muted">¥80.00 × ${quantity}</span><strong>¥${price()}</strong></div><div class="purchase-note"><strong>购买须知</strong>支付成功后出票，退改按票种实际规则执行。请核对信息，无需重复创建订单。</div><div class="payment-error" id="date-error" hidden>请选择游玩日期。</div>`;footer=`<div class="footer"><div class="footer-line"><div><span class="price-label">应付</span><span class="price">${money(price())}</span></div><button class="primary" id="submit">确认并支付</button></div></div>`;
 }else if(screen==='orders'){
 html=`<h2 class="title">我的订单</h2><div class="status-tabs">${[['all','全部'],['unpaid','待支付'],['paid','已支付'],['closed','已关闭']].map(([key,label])=>`<button class="status-tab ${filter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')}</div>${filter==='all'||filter===status?orderItem():'<div class="empty">暂无相关订单</div>'}`;footer=nav('orders');
 }else{
 html=`<div class="status-heading"><span class="status-symbol">${icon(status==='paid'?'check':'clock')}</span><h2 class="title">${status==='paid'?'支付成功':'订单待支付'}</h2><p class="subtitle">${status==='paid'?'门票已出票，可查看入园凭证':'完成支付后出票，无需重复下单'}</p></div><div class="due-amount"><span class="price-label">${status==='paid'?'实付金额':'待支付金额'}</span><span class="price">${money(price())}</span></div><div class="result-product">${productLine()}</div><div class="info-row" style="margin-top:16px"><span>游玩日期</span><span>${date||'2026-09-07'}</span></div><div class="info-row"><span>订单号</span><span class="order-number">PROTOTYPE-20260907-001</span></div>${paymentError?'<div class="payment-error"><strong>暂时无法打开收银台</strong>当前环境不支持支付（示例）。订单已保留，可稍后继续支付。</div>':''}${status==='paid'?'<div class="ticket-proof"><span class="small muted">入园凭证 · 示例</span><span class="code">DEMO — NOT VALID</span><p>设计预览，不可用于核销或入园</p></div>':''}`;
 footer=`<div class="footer">${status!=='paid'?'<button class="primary" id="pay">继续支付</button>':''}<div class="result-actions"><button class="text-button" data-go="orders">查看全部订单</button><button class="text-button" data-go="home">继续购票</button></div></div>`;
 }
 document.querySelector('#view').innerHTML=`<div class="content">${html}</div>`;
 document.querySelector('#footer').innerHTML=footer;
 document.querySelector('#view').scrollTop=0;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
 bind('plus',()=>{quantity=Math.min(10,quantity+1);render()});bind('minus',()=>{quantity=Math.max(1,quantity-1);render()});
 bind('submit',()=>{if(!date){document.querySelector('#date-error').hidden=false;return}status='unpaid';paymentError=true;go('result')});
 bind('pay',()=>{paymentError=true;render()});
 const dateInput=document.querySelector('#use-date');if(dateInput)dateInput.onchange=e=>{date=e.target.value};
 const search=document.querySelector('#search');if(search)search.oninput=()=>{const match='云门山景区成人门票'.includes(search.value.trim());document.querySelector('#product-list').hidden=!match;document.querySelector('#no-results').hidden=match};
 document.querySelector('#mobile-screen').onchange=e=>go(e.target.value);
}
function go(next){screen=next;const url=new URL(location);url.searchParams.set('screen',screen);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
function switchVariant(){variant=variant==='A'?'B':'A';go(screen)}
document.querySelector('#back').innerHTML=icon('back');document.querySelector('#back').onclick=()=>go(screen==='confirm'?'product':screen==='result'?'orders':'home');
document.querySelector('#prev-variant').innerHTML=icon('back');document.querySelector('#next-variant').innerHTML=icon('next');
document.querySelector('#prev-variant').onclick=switchVariant;document.querySelector('#next-variant').onclick=switchVariant;
document.querySelector('#demo-state').onchange=e=>{status=e.target.value==='paid'?'paid':'unpaid';paymentError=e.target.value==='failed';go('result')};
document.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.target.isContentEditable)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant()}});
render();
</script>
</body></html>
