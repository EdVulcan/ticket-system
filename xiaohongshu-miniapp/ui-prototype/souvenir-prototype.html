</style></head><body><main class="studio"><aside class="notes"><h1>把这一次出发，<br>留在手机里。</h1><p>电子票首先要方便出示，<br>也可以像一张旅行明信片。</p><p class="variant-desc" id="description"></p><div class="rule"></div><div class="options"><label><input id="showPhoto" type="checkbox" checked> 展示商品图</label><label><input id="longName" type="checkbox"> 长名称</label></div><div class="rule"></div><small>设计原型 · 不产生真实订单<br>所有票码均为无效演示内容。<br>正式页面使用商户维护的商品图片。</small></aside><section class="phone"><header class="nav"><span class="back" aria-hidden="true"></span><span id="navTitle">云门山景区</span><span class="capsule" aria-hidden="true">···<i></i></span></header><div id="surface" class="surface"></div></section></main><nav class="switcher" aria-label="设计方案切换"><button id="prev" aria-label="上一个方案"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><strong id="variantLabel"></strong><button id="next" aria-label="下一个方案"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></svg></button></nav><div id="modal" class="qr-modal" role="dialog" aria-modal="true" aria-label="放大票码" hidden><button class="close" aria-label="关闭放大票码">×</button><h2>请出示此码核验</h2><div class="qr" id="largeQR"></div><p>演示票码 · 不可实际核销</p></div>
<script>
const variants=['A','B','C'];const names={A:'拼贴纪念票',B:'几何版画',C:'极简票根'};const descriptions={A:'A · 拼贴纪念票。浅绿纸面、杏色票根、圆环与细线，像一张轻盈的设计纸品。',B:'B · 几何版画。蓝色字体、抽象线条与错位色块，排版更鲜明，偏重平面设计感。',C:'C · 极简票根。保留大二维码，用一点暖色、几何纹样和虚线营造细节。'};
variants.push('D');names.D='展览入场券';descriptions.D='D · 展览入场券。黑白粗排版、一笔朱红、直线分区和醒目的票序号。更像值得保留的展览票，不依赖照片或几何插画。';
descriptions.B='B · 已选布局。票名是上半部分主标题，商户名作为辅助信息。保持几何版画排版与商城青蓝、暖橙配色。';
const qs=new URLSearchParams(location.search);let variant=variants.includes(qs.get('variant'))?qs.get('variant'):'B';
document.querySelector('.notes h1').innerHTML='一张小小的票，<br>也值得留下。';
document.querySelector('.notes p').innerHTML='不靠照片，用色彩、线条和排版，<br>做一张有设计感的电子纪念票。';
document.querySelector('.options label').lastChild.textContent=' 展示设计元素';
document.querySelector('.notes small').innerHTML='设计原型 · 不产生真实订单<br>所有票码均为无效演示内容。<br>不使用照片或外部素材，几何元素直接绘制；正式页面的商户与商品名称仍动态读取。';
const check='<svg class="check" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="m6 10 3 3 5-6"/></svg>';
const code=qrcode(0,'M');code.addData('DEMO-NOT-VALID');code.make();const qrSVG=code.createSvgTag({cellSize:5,margin:20,scalable:true});
const qrButton=()=>`<button class="qr-button" aria-label="放大票码"><span class="qr">${qrSVG}</span></button>`;
const ornament=()=>`<svg class="ornament" viewBox="0 0 76 86" aria-hidden="true"><circle cx="40" cy="35" r="25" fill="#eeb487"/><circle cx="40" cy="35" r="17" fill="#e7efe6"/><path d="M16 55 56 15M12 65 65 12" stroke="#729783" stroke-width="1.3"/><path d="M60 65v14m-7-7h14" stroke="#517e65" stroke-width="1.5"/></svg>`;
const picture=()=>`<div class="graphic-band" aria-hidden="true"><svg viewBox="0 0 340 150" preserveAspectRatio="xMidYMid slice"><circle cx="278" cy="37" r="50" fill="${variant==='B'?'#f7dfcf':'#f0d4b7'}"/><path d="M-30 130C40 130 28 28 96 28S145 131 205 131s75-63 154-63" fill="none" stroke="${variant==='B'?'#087f8c':'#c18d69'}" stroke-width="1.5"/><path d="M-30 142C40 142 28 40 96 40S145 143 205 143s75-63 154-63" fill="none" stroke="${variant==='B'?'#94c6cb':'#dfb99a'}" stroke-width="1"/><rect x="129" y="-15" width="39" height="102" rx="19.5" transform="rotate(36 149 36)" fill="${variant==='B'?'#b9dde0':'#eadcc9'}"/><path d="M29 34v14m-7-7h14M284 109v14m-7-7h14" stroke="${variant==='B'?'#d45d28':'#a78163'}" stroke-width="1.5"/></svg></div>`;
const footer=()=>`<button class="order-button" aria-expanded="false">订单信息 <svg viewBox="0 0 16 16"><path d="m5 3 5 5-5 5"/></svg></button><div class="order-detail" hidden><p>实付金额　¥80.00</p><p>订单号　DEMO-20260907-001</p><p>演示订单，不代表真实票权。</p></div>`;
function render(){const merchant=document.querySelector('#longName').checked?'云门山旅游度假区游客服务中心':'云门山景区';const product='景区成人门票';const title=`<h2 class="merchant">${merchant}</h2><p class="product">${product}</p>`;const status=`<div class="status"><span class="paid">${check}支付成功</span><span>电子票</span></div>`;const hint='<p class="qr-label">请出示此码核验</p><p class="privacy">票码可用于核验，请勿公开分享</p>';const stub='<div class="bottom-line"><span>DEMO-NOT-VALID</span><span class="ticket-sequence">第 1 张 / 共 1 张</span></div>';let html;
if(variant==='A')html=status+`<article class="card"><div class="graphic-header">${ornament()}<div class="heading">${title}</div><div class="ticket-caption"><span>电子票</span><span>第 1 张 / 共 1 张</span></div></div><div class="tear"></div><div class="admission">${qrButton()}${hint}</div><div class="tear"></div><div class="bottom-line"><span>票码<br>DEMO-NOT-VALID</span><span class="ticket-sequence">请按所购票种规则使用</span></div></article>`+footer();
if(variant==='B')html=status+`<div class="heading"><h2 class="merchant ticket-name">${product}</h2><p class="product merchant-caption">${merchant}</p></div>${picture()}<div class="admission"><div class="entry-info"><h3 class="entry-title">电子票</h3><p class="entry-copy">请出示此码核验<br>按所购票种规则使用</p><span class="ticket-sequence">第 1 张 / 共 1 张</span></div>${qrButton()}</div><div class="bottom-line"><span>DEMO-NOT-VALID</span><span>请勿公开分享票码</span></div>`+footer();
if(variant==='C')html=status+`<article class="card"><div class="heading">${title}</div><div class="admission"><h3 class="entry-title">请出示此码核验</h3>${qrButton()}<p class="privacy">票码可用于核验，请勿公开分享</p></div>${picture()}${stub}</article>`+footer();
if(variant==='D')html=status+`<article class="exhibition-ticket"><div class="exhibit-top"><span>电子票</span><span>1 / 1</span></div><div class="exhibit-heading">${title}</div><div class="exhibit-divider"><span>请出示此码核验</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v15m-5-5 5 5 5-5"/></svg></div><div class="exhibit-scan">${qrButton()}<p class="privacy">票码可用于核验，请勿公开分享</p></div><div class="exhibit-stub"><span class="exhibit-number" aria-label="第 1 张">01</span><div class="exhibit-code">票码<code>DEMO-NOT-VALID</code></div><span class="vertical-label">电子凭证</span></div></article>`+footer();
document.querySelector('#surface').className='surface '+({A:'postcard',B:'editorial',C:'wallet',D:'exhibition'}[variant])+(document.querySelector('#showPhoto').checked?'':' plain-ornaments');document.querySelector('#surface').innerHTML=html;document.querySelector('#variantLabel').textContent=variant+' / '+names[variant];document.querySelector('#description').textContent=descriptions[variant];document.querySelector('#navTitle').textContent=merchant;document.querySelectorAll('.qr-button').forEach(b=>b.onclick=()=>{document.querySelector('#largeQR').innerHTML=qrSVG;document.querySelector('#modal').hidden=false;document.querySelector('.close').focus()});document.querySelector('.order-button').onclick=e=>{const b=e.currentTarget;const d=document.querySelector('.order-detail');d.hidden=!d.hidden;b.setAttribute('aria-expanded',String(!d.hidden))};}
function cycle(step){variant=variants[(variants.indexOf(variant)+step+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelectorAll('.options input').forEach(x=>x.onchange=render);document.querySelector('.close').onclick=()=>{document.querySelector('#modal').hidden=true;document.querySelector('.qr-button').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#modal').hidden){document.querySelector('.close').click();return}if(!document.querySelector('#modal').hidden||e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});render();
