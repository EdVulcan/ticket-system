model = "gpt-5.6-luna"
model_reasoning_effort = "max"

[agents]
enabled = true
# The current desktop runtime exposes Luna for the primary task, but only Sol/Terra for child threads.
# Keep Luna as the supervisor and use the available Terra route for workers unless a role overrides it.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 6
